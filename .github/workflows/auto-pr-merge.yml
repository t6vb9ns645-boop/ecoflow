name: Auto PR & Merge (Claude Branches)

# Ablauf: Ein Push auf claude/** eroeffnet einen Entwurf (Draft-PR). Entwuerfe
# werden NICHT automatisch gemergt — so bleibt die Freigabe beim Menschen.
# Sobald der PR ueber "Ready for review" aus dem Entwurfsstatus geholt wird,
# greift der bisherige Automatismus und merged ihn.

on:
  push:
    branches:
      - 'claude/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:

  # Wird bei Push auf claude/** ausgelöst: erstellt PR falls noch keiner existiert
  create-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: PR erstellen (falls noch nicht vorhanden)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          existing=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base main \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$existing" ]; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --title "auto: ${BRANCH}" \
              --body "Automatisch erstellter Entwurf von Branch \`${BRANCH}\`. Zum Mergen auf \"Ready for review\" setzen." \
              --base main \
              --head "$BRANCH" \
              --draft
            echo "Draft-PR erstellt fuer Branch ${BRANCH}"
          else
            echo "PR #${existing} existiert bereits"
          fi

  # Wird bei PR-Event ausgelöst: merged automatisch wenn Quell-Branch claude/**
  # ist UND der PR kein Entwurf mehr ist.
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.draft == false
    steps:
      - name: PR mergen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --merge \
            --delete-branch
          echo "PR #${{ github.event.number }} gemergt"
